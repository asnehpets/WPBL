<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2a4f">
<title>WPBL — Wall Pickleball League</title>

<style>
:root{
  --navy:#0d2a4f;
  --blue:#1459a6;
  --red:#d8242f;
  --bg:#f4f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#6b7485;
  --line:#dfe5ee;
  --ok:#147d4b;
  --warn:#a35a00;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:linear-gradient(135deg,#0d2a4f,#164e8d);
}
.authbox{
  width:min(440px,100%);
  background:#fff;
  border-radius:22px;
  padding:24px;
  text-align:center;
}
.authlogo{
  width:180px;
  max-height:125px;
  object-fit:contain;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  height:62px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 14px;
  background:var(--navy);
  color:white;
  box-shadow:0 2px 12px #0002;
}
.logo{
  width:56px;
  height:42px;
  object-fit:contain;
}
.brand{flex:1}
.brand strong{font-size:19px}
.brand small{display:block;opacity:.78}
.iconbtn{
  border:1px solid #ffffff35;
  background:#ffffff18;
  color:white;
  border-radius:11px;
  padding:9px 11px;
}

.control{
  position:sticky;
  top:62px;
  z-index:15;
  display:flex;
  gap:10px;
  align-items:center;
  padding:9px 14px;
  overflow:auto;
  background:white;
  border-bottom:1px solid var(--line);
}
.control label{
  font-size:11px;
  color:var(--muted);
}

.main{
  max-width:980px;
  margin:auto;
  padding:16px 14px 90px;
}

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:white;
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav button{
  border:0;
  background:white;
  color:#667085;
  padding:9px 3px;
  font-size:11px;
}
.nav button span{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}
.nav button.active{
  color:var(--blue);
  font-weight:800;
}

h1{font-size:25px;margin:2px 0 4px}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 9px}
.sub{color:var(--muted);margin:0 0 15px}
.tiny{font-size:12px}
.muted{color:var(--muted)}

.card{
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 3px 14px #17315a0a;
}
.hero{
  background:linear-gradient(135deg,var(--navy),#173e72);
  color:white;
  border:0;
}
.hero .sub{color:#dce8fa}

.grid{
  display:grid;
  gap:12px;
}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:680px){
  .grid2{grid-template-columns:1fr}
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:9px}

.btn{
  border:0;
  border-radius:11px;
  padding:10px 13px;
  font-weight:750;
  color:white;
  background:var(--blue);
}
.btn.ghost{background:#eef3f9;color:var(--navy)}
.btn.red{background:var(--red)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:7px 9px;font-size:13px}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#eaf1fb;
  color:var(--blue);
  font-size:12px;
  font-weight:750;
}
.badge.red{background:#fdecef;color:var(--red)}
.badge.ok{background:#e9f7f0;color:var(--ok)}
.badge.warn{background:#fff2df;color:var(--warn)}

.item{
  background:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px;
  margin:7px 0;
}
.game{border-left:5px solid var(--blue)}
.game.current{border-left-color:var(--red)}
.game.pending{border-left-color:#e1a100}
.game.done{opacity:.65}

input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  background:white;
  color:var(--text);
  padding:10px;
}
textarea{min-height:90px}
.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}
.field label{
  font-size:12px;
  color:var(--muted);
  font-weight:650;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  border-bottom:1px solid var(--line);
  padding:9px 7px;
  text-align:left;
}
th{
  color:var(--muted);
  font-size:12px;
}
.tablewrap{overflow:auto}

.notice{
  padding:10px 12px;
  border-radius:10px;
  background:#eef5ff;
  color:#174d85;
  font-size:13px;
}
.notice.warn{
  background:#fff3df;
  color:#8a4e00;
}
.notice.ok{
  background:#eaf8f0;
  color:#17623e;
}

.modalback{
  position:fixed;
  inset:0;
  z-index:80;
  background:#06152bcc;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.modal{
  width:min(680px,100%);
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:22px 22px 0 0;
  padding:18px;
}
hr{
  border:0;
  border-top:1px solid var(--line);
  margin:14px 0;
}
</style>
</head>

<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL="https://trujrwhkkjepyorpvjjr.supabase.co";
const SUPABASE_KEY="sb_publishable_RcP9-stV689diug__RIZkg_g5agpSNR";

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const LOGO="https://raw.githubusercontent.com/asnehpets/GLOAT-League/main/approved-wpbl-logo.png";
const KEY="wpbl_clean_v1";

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

const uid=(p="id")=>
  p+"_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);

const esc=s=>
  String(s??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[m]));

const today=()=>new Date().toISOString().slice(0,10);

const fmtDate=d=>
  new Date(d+"T12:00:00").toLocaleDateString([],{
    month:"short",
    day:"numeric",
    year:"numeric"
  });

const fmtTime=d=>
  new Date(d).toLocaleTimeString([],{
    hour:"numeric",
    minute:"2-digit"
  });

let authSession=null;
let session="";
let state=null;
let view="home";

function fresh(id,name,email){
  return{
    version:1,
    players:[{
      id,
      name:name||"Stephen Sauer",
      email:email||"",
      role:"admin",
      active:true,
      sub:false
    }],
    seasons:[{
      id:"season1",
      name:"Fall 2026",
      format:"individual",
      status:"active",
      startTime:"18:00",
      gamesPerPair:2,
      target:11,
      winBy:2,
      rsvpDays:2,
      playoffs:true,
      playoffQualifiers:4,
      players:[id],
      weeks:[]
    }],
    activeSeason:"season1",
    board:[],
    settings:{gameMinutes:18}
  };
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
}

function load(){
  try{
    return JSON.parse(localStorage.getItem(KEY));
  }catch{
    return null;
  }
}

function season(){
  return state?.seasons.find(x=>x.id===state.activeSeason)||state?.seasons[0];
}

function week(){
  const s=season();
  if(!s)return null;
  return s.weeks.find(x=>x.id===s.activeWeek)||s.weeks.at(-1)||null;
}

function me(){
  return state?.players.find(x=>x.id===session);
}

function player(id){
  return state.players.find(x=>x.id===id);
}

function pname(id){
  return player(id)?.name||"Unknown";
}

function isAdmin(){
  return me()?.role==="admin";
}

async function boot(){
  const {data:{session:s}}=await sb.auth.getSession();

  authSession=s;
  session=s?.user?.id||"";

  if(!session){
    renderAuth();
    return;
  }

  const {data:profile,error}=await sb
    .from("profiles")
    .select("*")
    .eq("id",session)
    .single();

  if(error){
    document.getElementById("root").innerHTML=`
      <div class="auth">
        <div class="authbox">
          <img class="authlogo" src="${LOGO}">
          <h1>WPBL</h1>
          <p>${esc(error.message)}</p>
          <button class="btn" onclick="logout()">Sign out</button>
        </div>
      </div>
    `;
    return;
  }

  state=load();

  if(!state){
    state=fresh(
      session,
      profile.name||"Stephen Sauer",
      profile.email||s.user.email||""
    );
  }

  let p=state.players.find(x=>x.id===session);

  if(!p){
    p={
      id:session,
      name:profile.name||s.user.email,
      email:profile.email||s.user.email,
      role:profile.role||"member",
      active:true,
      sub:profile.is_substitute||false
    };

    state.players.push(p);

    if(!season().players.includes(session)){
      season().players.push(session);
    }
  }else{
    p.name=profile.name||p.name;
    p.email=profile.email||s.user.email||p.email;
    p.role=profile.role||p.role;
  }

  save();
  render();
}

async function sendMagicLink(){
  const email=$("#email").value.trim().toLowerCase();
  const msg=$("#authMsg");

  if(!email){
    msg.textContent="Enter your email.";
    return;
  }

  msg.textContent="Sending secure sign-in link...";

  const {error}=await sb.auth.signInWithOtp({
    email,
    options:{
      shouldCreateUser:false,
      emailRedirectTo:location.origin+location.pathname
    }
  });

  msg.textContent=error
    ?error.message
    :"Check your email for the WPBL sign-in link.";
}

async function logout(){
  await sb.auth.signOut();
  session="";
  renderAuth();
}

function renderAuth(){
  document.getElementById("root").innerHTML=`
    <div class="auth">
      <div class="authbox">
        <img class="authlogo" src="${LOGO}">
        <h1>WPBL</h1>
        <p class="sub">Wall Pickleball League</p>

        <div class="notice">
          Invite-only league. Use the email address invited by the commissioner.
        </div>

        <br>

        <div class="field">
          <label>Email</label>
          <input id="email" type="email" placeholder="you@example.com">
        </div>

        <br>

        <button class="btn" style="width:100%" onclick="sendMagicLink()">
          Email me a secure sign-in link
        </button>

        <p id="authMsg" class="tiny muted"></p>
      </div>
    </div>
  `;
}

function navButton(v,icon,label){
  return`
    <button class="${view===v?"active":""}" onclick="go('${v}')">
      <span>${icon}</span>
      ${label}
    </button>
  `;
}

function render(){
  if(!session||!me()){
    renderAuth();
    return;
  }

  const s=season();

  document.getElementById("root").innerHTML=`
    <header class="topbar">
      <img class="logo" src="${LOGO}">
      <div class="brand">
        <strong>WPBL</strong>
        <small>Wall Pickleball League</small>
      </div>
      <button class="iconbtn" onclick="go('board')">💬</button>
      <button class="iconbtn" onclick="go('profile')">👤</button>
    </header>

    <div class="control">
      <label>
        LEAGUE / SEASON
        <select id="seasonSelect">
          ${state.seasons.map(x=>`
            <option value="${x.id}" ${x.id===state.activeSeason?"selected":""}>
              ${esc(x.name)}
            </option>
          `).join("")}
        </select>
      </label>

      <span class="badge">
        ${s.format==="individual"?"Rotating Partners":"Fixed Teams"}
      </span>
    </div>

    <main id="main" class="main"></main>

    <nav class="nav">
      ${navButton("home","⌂","Home")}
      ${navButton("schedule","▣","Schedule")}
      ${navButton("live","▶","Live")}
      ${navButton("standings","★","Standings")}
      ${navButton("more","☰","More")}
    </nav>

    <div id="modal"></div>
  `;

  $("#seasonSelect").onchange=e=>{
    state.activeSeason=e.target.value;
    save();
    render();
  };

  renderView();
}

function go(v){
  view=v;
  render();
}

function renderView(){
  const el=$("#main");

  ({
    home:homeView,
    schedule:scheduleView,
    live:liveView,
    standings:standingsView,
    board:boardView,
    more:moreView,
    profile:profileView,
    admin:adminView,
    players:playersView
  }[view]||homeView)(el);
}

function homeView(el){
  const s=season();
  const w=week();

  el.innerHTML=`
    <h1>${esc(s.name)}</h1>
    <p class="sub">
      ${s.format==="individual"
        ?"Individual standings • rotating weekly partners"
        :"Fixed-team league"}
    </p>

    <div class="card hero">
      <h2>${w?`Week ${w.number} — ${fmtDate(w.date)}`:"Season ready"}</h2>

      <p class="sub">
        ${w
          ?"Set your availability before the weekly schedule is generated."
          :"Create the first week from Admin or Schedule."}
      </p>

      ${w?`
        <div class="row">
          <button class="btn ok" onclick="rsvp('in')">✓ Playing</button>
          <button class="btn red" onclick="rsvp('out')">✕ Not Playing</button>
        </div>
      `:""}
    </div>

    <div class="grid grid2">
      <div class="card">
        <h3>Standings</h3>
        ${standingsMini()}
        <button class="btn ghost sm" onclick="go('standings')">Full standings</button>
      </div>

      <div class="card">
        <h3>Message Board</h3>
        <p class="muted">${state.board.length} posts</p>
        <button class="btn ghost sm" onclick="go('board')">Open board</button>
      </div>
    </div>
  `;
}

function rsvp(status){
  const w=week();
  if(!w)return;

  w.availability=w.availability||{};
  w.availability[session]=status;

  save();
  homeView($("#main"));
}

function scheduleView(el){
  const w=week();

  el.innerHTML=`
    <div class="row between">
      <div>
        <h1>Schedule</h1>
        <p class="sub">${w?`Week ${w.number} • ${fmtDate(w.date)}`:"No week created"}</p>
      </div>

      ${isAdmin()?`
        <button class="btn" onclick="openWeek()">Week Setup</button>
      `:""}
    </div>

    ${!w?`
      <div class="card">No weekly schedule yet.</div>
    `:`
      <div class="card">
        <h3>Availability</h3>

        ${season().players.map(id=>{
          const a=w.availability?.[id];
          return`
            <span class="badge ${a==="in"?"ok":a==="out"?"red":""}">
              ${esc(pname(id))}: ${a==="in"?"Playing":a==="out"?"Out":"No response"}
            </span>
          `;
        }).join(" ")}

        ${isAdmin()?`
          <hr>
          <button class="btn" onclick="generateSchedule()">Generate Schedule</button>
        `:""}
      </div>

      <div class="card">
        <h2>Game Order</h2>

        ${(w.games||[]).length
          ?w.games.map((g,i)=>gameCard(g,i)).join("")
          :`<p class="muted">No games generated yet.</p>`}
      </div>
    `}
  `;
}

function openWeek(){
  const s=season();

  openModal(`
    <h2>Create Week</h2>

    <div class="field">
      <label>Week number</label>
      <input id="weekNum" type="number" value="${(s.weeks.at(-1)?.number||0)+1}">
    </div>

    <br>

    <div class="field">
      <label>Game date</label>
      <input id="weekDate" type="date" value="${today()}">
    </div>

    <br>

    <button class="btn" onclick="saveWeek()">Save Week</button>
  `);
}

function saveWeek(){
  const s=season();

  const w={
    id:uid("week"),
    number:+$("#weekNum").value,
    date:$("#weekDate").value,
    availability:{},
    partners:{},
    games:[]
  };

  s.weeks.push(w);
  s.activeWeek=w.id;

  save();
  closeModal();
  go("schedule");
}

function pairHistory(a,b){
  let count=0;

  season().weeks.forEach(w=>{
    if((w.partners?.[a]||[]).includes(b))count++;
  });

  return count;
}

function makePairs(ids){
  let remaining=[...ids];
  const teams=[];

  while(remaining.length>=2){
    const a=remaining.shift();

    const b=[...remaining].sort((x,y)=>
      pairHistory(a,x)-pairHistory(a,y)
      ||Math.random()-.5
    )[0];

    remaining=remaining.filter(x=>x!==b);
    teams.push([a,b]);
  }

  return teams;
}

function generateSchedule(){
  const s=season();
  const w=week();

  const available=s.players.filter(id=>
    player(id)?.active &&
    w.availability?.[id]!=="out"
  );

  if(available.length<4){
    alert("You need at least 4 available players.");
    return;
  }

  const teams=makePairs(available);

  w.partners={};

  teams.forEach(team=>{
    team.forEach(id=>{
      w.partners[id]=team.filter(x=>x!==id);
    });
  });

  const matchups=[];

  for(let a=0;a<teams.length;a++){
    for(let b=a+1;b<teams.length;b++){
      for(let n=0;n<(s.gamesPerPair||1);n++){
        matchups.push([teams[a],teams[b]]);
      }
    }
  }

  w.games=matchups.map((m,i)=>({
    id:uid("game"),
    teamA:m[0],
    teamB:m[1],
    status:"scheduled",
    score:null,
    estimate:new Date(
      new Date(`${w.date}T${s.startTime}`).getTime()
      +i*(state.settings.gameMinutes||18)*60000
    ).toISOString()
  }));

  save();
  go("schedule");
}

function gameCard(g,i){
  return`
    <div class="item game ${g.status==="confirmed"?"done":g.status==="pending"?"pending":""}">
      <div class="row between">
        <b>Game ${i+1}</b>
        <span class="tiny muted">${g.estimate?fmtTime(g.estimate):""}</span>
      </div>

      <p>
        <b>${g.teamA.map(pname).join(" & ")}</b><br>
        vs<br>
        <b>${g.teamB.map(pname).join(" & ")}</b>
      </p>

      ${g.score?`
        <b>${g.score.a} – ${g.score.b}</b>
      `:""}
    </div>
  `;
}

function nextGame(){
  return week()?.games?.find(g=>g.status!=="confirmed");
}

function liveView(el){
  const w=week();

  if(!w){
    el.innerHTML=`<h1>Live</h1><div class="card">No week scheduled.</div>`;
    return;
  }

  const g=nextGame();

  if(!g){
    el.innerHTML=`
      <h1>League Night</h1>
      <div class="card">
        <h2>All games complete 🎉</h2>
      </div>
    `;
    return;
  }

  el.innerHTML=`
    <h1>League Night</h1>
    <p class="sub">One game at a time</p>

    <div class="card game current">
      <span class="badge red">CURRENT GAME</span>

      <h2 style="margin-top:14px">
        ${g.teamA.map(pname).join(" & ")}
      </h2>

      <p>vs</p>

      <h2>
        ${g.teamB.map(pname).join(" & ")}
      </h2>

      ${g.status==="pending"
        ?pendingScore(g)
        :scoreForm(g)}
    </div>
  `;
}

function scoreForm(g){
  const participating=[...g.teamA,...g.teamB].includes(session);

  if(!participating&&!isAdmin()){
    return `<div class="notice">Only participating players may enter the score.</div>`;
  }

  return`
    <hr>

    <div class="row">
      <input id="scoreA" type="number" min="0" placeholder="Score">
      <b>–</b>
      <input id="scoreB" type="number" min="0" placeholder="Score">

      <button class="btn" onclick="submitScore('${g.id}')">
        Submit Score
      </button>
    </div>
  `;
}

function submitScore(id){
  const g=week().games.find(x=>x.id===id);
  const a=+$("#scoreA").value;
  const b=+$("#scoreB").value;

  if(a===b){
    alert("Final score cannot be tied.");
    return;
  }

  g.score={a,b};
  g.submittedBy=session;
  g.status="pending";

  save();
  go("live");
}

function pendingScore(g){
  const submittedFromA=g.teamA.includes(g.submittedBy);
  const opponents=submittedFromA?g.teamB:g.teamA;
  const canConfirm=opponents.includes(session)||isAdmin();

  return`
    <hr>

    <div class="notice warn">
      Score awaiting opponent confirmation:
      <b>${g.score.a} – ${g.score.b}</b>
    </div>

    ${canConfirm?`
      <br>
      <div class="row">
        <button class="btn ok" onclick="confirmScore('${g.id}')">
          Confirm & Advance
        </button>

        <button class="btn ghost" onclick="correctScore('${g.id}')">
          Correct Score
        </button>
      </div>
    `:""}
  `;
}

function confirmScore(id){
  const g=week().games.find(x=>x.id===id);

  g.status="confirmed";
  g.confirmedBy=session;
  g.completedAt=new Date().toISOString();

  save();
  go("live");
}

function correctScore(id){
  const g=week().games.find(x=>x.id===id);

  g.status="scheduled";
  g.score=null;
  g.submittedBy=null;

  save();
  go("live");
}

function standings(){
  const rows={};

  season().players.forEach(id=>{
    rows[id]={
      id,
      w:0,
      l:0,
      gp:0,
      pf:0,
      pa:0
    };
  });

  season().weeks.forEach(w=>
    (w.games||[])
    .filter(g=>g.status==="confirmed")
    .forEach(g=>{
      const aWin=g.score.a>g.score.b;

      g.teamA.forEach(id=>{
        if(!rows[id])return;
        rows[id].gp++;
        rows[id].pf+=g.score.a;
        rows[id].pa+=g.score.b;
        aWin?rows[id].w++:rows[id].l++;
      });

      g.teamB.forEach(id=>{
        if(!rows[id])return;
        rows[id].gp++;
        rows[id].pf+=g.score.b;
        rows[id].pa+=g.score.a;
        aWin?rows[id].l++:rows[id].w++;
      });
    })
  );

  return Object.values(rows)
    .map(r=>({
      ...r,
      pct:r.gp?r.w/r.gp:0,
      pd:r.pf-r.pa
    }))
    .sort((a,b)=>
      b.pct-a.pct
      ||b.pd-a.pd
      ||b.w-a.w
    );
}

function newPost(){
  openModal(`
    <h2>New Board Post</h2>

    <div class="field">
      <label>Title</label>
      <input id="postTitle">
    </div>

    <br>

    <div class="field">

      <textarea id="postBody"></textarea>
    </div>

    <br>

    <button class="btn" onclick="savePost()">Post</button>
  `);
}

function savePost(){
  const title=$("#postTitle").value.trim();
  const body=$("#postBody").value.trim();

  if(!title)return;

  state.board.unshift({
    id:uid("post"),
    title,
    body,
    author:me().name,
    authorId:session,
    at:new Date().toISOString(),
    comments:[]
  });

  save();
  closeModal();
  go("board");
}

function addComment(id){
  const post=state.board.find(x=>x.id===id);
  const body=$("#comment_"+id).value.trim();

  if(!body)return;

  post.comments.push({
    id:uid("comment"),
    author:me().name,
    authorId:session,
    body,
    at:new Date().toISOString()
  });

  save();
  go("board");
}

function invitePlayer(){
  openModal(`

    <div class="field">
      <label>First name</label>
      <input id="firstName">
    </div>

    <br>

    <div class="field">
      <label>Last name</label>
      <input id="lastName">
    </div>

    <br>

    <div class="field">
      <label>Email</label>
      <input id="playerEmail" type="email">
    </div>

    <br>

    <label>
      <input id="substitute" type="checkbox" style="width:auto">
      Substitute pool
    </label>

    <br><br>

    <button class="btn" onclick="savePlayer()">Add Player</button>
  `);
}

function savePlayer(){
  const first=$("#firstName").value.trim();
  const last=$("#lastName").value.trim();
  const email=$("#playerEmail").value.trim();

  if(!first||!last){
    alert("First and last name are required.");
    return;
  }

  const p={
    id:uid("player"),
    name:`${first} ${last}`,
    first_name:first,
    last_name:last,
    email,
    role:"member",
    active:true,
    sub:$("#substitute").checked
  };

  state.players.push(p);
  season().players.push(p.id);

  save();
  closeModal();
  go("players");
}

function toggleAdmin(id){
  const p=player(id);

  p.role=p.role==="admin"
    ?"member"
    :"admin";

  save();
  go("players");
}

function openModal(content){
  $("#modal").innerHTML=`
    <div class="modalback" onclick="if(event.target===this)closeModal()">
      <div class="modal">

        <div class="row between">
          <span></span>
          <button class="btn ghost sm" onclick="closeModal()">Close</button>
        </div>

        ${content}
      </div>
    </div>
  `;
}

function closeModal(){
  $("#modal").innerHTML="";
}

sb.auth.onAuthStateChange((_event,s)=>{

});
