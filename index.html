<style>
:root{--navy:#0d2a4f;--blue:#1459a6;--red:#d8242f;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7485;--line:#dfe5ee;--ok:#147d4b;--warn:#a35a00}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0d2a4f,#164e8d)}
.authbox{width:min(440px,100%);background:#fff;border-radius:22px;padding:24px;text-align:center}
.authlogo{width:180px;max-height:125px;object-fit:contain}
.topbar{position:sticky;top:0;z-index:20;height:62px;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--navy);color:#fff}
.logo{width:56px;height:42px;object-fit:contain}
.brand{flex:1}
.brand strong{font-size:19px}
.brand small{display:block;opacity:.78}
.iconbtn{border:1px solid #ffffff35;background:#ffffff18;color:#fff;border-radius:11px;padding:9px 11px}
.control{position:sticky;top:62px;z-index:15;display:flex;gap:10px;align-items:center;padding:9px 14px;overflow:auto;background:#fff;border-bottom:1px solid var(--line)}
.control label{font-size:11px;color:var(--muted)}
.main{max-width:980px;margin:auto;padding:16px 14px 92px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{border:0;background:#fff;color:#667085;padding:9px 3px;font-size:11px}
.nav button span{display:block;font-size:20px;margin-bottom:2px}
.nav button.active{color:var(--blue);font-weight:800}
h1{font-size:25px;margin:2px 0 4px}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 9px}
.sub{color:var(--muted);margin:0 0 15px}
.tiny{font-size:12px}
.muted{color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 3px 14px #17315a0a}
.hero{background:linear-gradient(135deg,var(--navy),#173e72);color:#fff;border:0}
.hero .sub{color:#dce8fa}
.grid{display:grid;gap:12px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:680px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:750;color:#fff;background:var(--blue)}
.btn.ghost{background:#eef3f9;color:var(--navy)}
.btn.red{background:var(--red)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:7px 9px;font-size:13px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eaf1fb;color:var(--blue);font-size:12px;font-weight:750}
.badge.red{background:#fdecef;color:var(--red)}
.badge.ok{background:#e9f7f0;color:var(--ok)}
.badge.warn{background:#fff2df;color:var(--warn)}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin:7px 0}
.game{border-left:5px solid var(--blue)}
.game.current{border-left-color:var(--red)}
.game.pending{border-left-color:#e1a100}
.game.done{opacity:.67}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);padding:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted);font-weight:650}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:9px 7px;text-align:left}
th{color:var(--muted);font-size:12px}
.tablewrap{overflow:auto}
.notice{padding:10px 12px;border-radius:10px;background:#eef5ff;color:#174d85;font-size:13px}
.notice.ok{background:#eaf8f0;color:#17623e}
.notice.red{background:#fdecef;color:#9d1620}
.scoreline{font-size:24px;font-weight:800}
.teamline{font-weight:800;font-size:17px}
</style>

}

function weeks(){

?D.weeks.filter(w=>w.season_id===s.id).sort((a,b)=>a.number-b.number)
:[];
}

function gamesFor(wid){

.filter(g=>g.week_id===wid)
.sort((a,b)=>a.position-b.position);
}

function availabilityFor(wid,pid=session){

function showJoinForm(){

$("#joinBox").classList.remove("hidden");
}

function showLoginForm(){

async function passwordSignIn(){

const email=$("#email").value.trim().toLowerCase();
const password=$("#password").value;
const msg=$("#authMsg");

if(!email||!password)
return msg.textContent="Enter your email and password.";

msg.textContent="Signing in...";

const{error}=await sb.auth.signInWithPassword({
email,
password
});

if(error)msg.textContent=error.message;
}

async function joinWPBL(){

const first_name=$("#joinFirst").value.trim();
const last_name=$("#joinLast").value.trim();
const email=$("#joinEmail").value.trim().toLowerCase();
const password=$("#joinPassword").value;
const confirm=$("#joinConfirm").value;
const msg=$("#joinMsg");

if(!first_name||!last_name||!email||!password||!confirm)
return msg.textContent="Complete all fields.";

if(password.length<8)
return msg.textContent="Password must be at least 8 characters.";

if(password!==confirm)
return msg.textContent="Passwords do not match.";

msg.textContent="Creating account...";

const{data,error}=await sb.auth.signUp({
email,
password,
options:{
data:{
first_name,
last_name
}
}
});

if(error)
return msg.textContent=error.message;

if(!data.session)
return msg.textContent="Account created but could not sign in automatically.";

const{error:joinError}=await sb.rpc("wpbl_join_league",{
p_first_name:first_name,
p_last_name:last_name
});

if(joinError)
return msg.textContent=joinError.message;

session=data.user.id;

await reload();
}

async function logout(){

await sb.auth.signOut();

session="";

renderAuth();
}
