<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2a4f">
<title>WPBL — Wall Pickleball League</title>
<style>
:root{--navy:#0d2a4f;--blue:#1459a6;--red:#d8242f;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7485;--line:#dfe5ee;--ok:#147d4b;--warn:#a35a00}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0d2a4f,#164e8d)}
.authbox{width:min(440px,100%);background:#fff;border-radius:22px;padding:24px;text-align:center}
.authlogo{width:180px;max-height:125px;object-fit:contain}
.topbar{position:sticky;top:0;z-index:20;height:62px;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--navy);color:#fff}
.logo{width:56px;height:42px;object-fit:contain}
.brand{flex:1}
.brand strong{font-size:19px}
.brand small{display:block;opacity:.78}
.iconbtn{border:1px solid #ffffff35;background:#ffffff18;color:#fff;border-radius:11px;padding:9px 11px}
.control{position:sticky;top:62px;z-index:15;display:flex;gap:10px;align-items:center;padding:9px 14px;overflow:auto;background:#fff;border-bottom:1px solid var(--line)}
.control label{font-size:11px;color:var(--muted)}
.main{max-width:980px;margin:auto;padding:16px 14px 92px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{border:0;background:#fff;color:#667085;padding:9px 3px;font-size:11px}
.nav button span{display:block;font-size:20px;margin-bottom:2px}
.nav button.active{color:var(--blue);font-weight:800}
h1{font-size:25px;margin:2px 0 4px}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 9px}
.sub{color:var(--muted);margin:0 0 15px}
.tiny{font-size:12px}
.muted{color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 3px 14px #17315a0a}
.hero{background:linear-gradient(135deg,var(--navy),#173e72);color:#fff;border:0}
.hero .sub{color:#dce8fa}
.grid{display:grid;gap:12px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:680px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:750;color:#fff;background:var(--blue)}
.btn.ghost{background:#eef3f9;color:var(--navy)}
.btn.red{background:var(--red)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:7px 9px;font-size:13px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eaf1fb;color:var(--blue);font-size:12px;font-weight:750}
.badge.red{background:#fdecef;color:var(--red)}
.badge.ok{background:#e9f7f0;color:var(--ok)}
.badge.warn{background:#fff2df;color:var(--warn)}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin:7px 0}
.game{border-left:5px solid var(--blue)}
.game.current{border-left-color:var(--red)}
.game.pending{border-left-color:#e1a100}
.game.done{opacity:.67}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);padding:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted);font-weight:650}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:9px 7px;text-align:left}
th{color:var(--muted);font-size:12px}
.tablewrap{overflow:auto}
.notice{padding:10px 12px;border-radius:10px;background:#eef5ff;color:#174d85;font-size:13px}

.notice.red{background:#fdecef;color:#9d1620}

 if(error)throw error;

   "wpbl_v2_teams","wpbl_v2_weeks","wpbl_v2_availability",
   "wpbl_v2_weekly_pairs","wpbl_v2_games","wpbl_v2_posts",
   "wpbl_v2_comments","wpbl_v2_poll_options","wpbl_v2_poll_votes",
   "wpbl_v2_playoff_matches"
  ];

  const a=await Promise.all(names.map(q));

  [
   D.profiles,D.seasons,D.seasonPlayers,D.teams,D.weeks,
   D.availability,D.pairs,D.games,D.posts,D.comments,
   D.pollOptions,D.pollVotes,D.playoffs
  ]=a;

  if(!activeSeasonId||!D.seasons.some(s=>s.id===activeSeasonId)){
   activeSeasonId=(D.seasons.find(s=>s.status==="active")||D.seasons[0])?.id||"";
   localStorage.setItem("wpbl_active_season",activeSeasonId);

  render();

   </div></div>`;
 }
}

async function joinWPBL(){

 const last_name=$("#joinLast").value.trim();

  return msg.textContent="Password must be at least 8 characters.";

 if(password!==confirm)
  return msg.textContent="Passwords do not match.";

 msg.textContent="Creating account...";

 const{data,error}=await sb.auth.signUp({
  email,password,
  options:{data:{first_name,last_name}}
 });

 if(error)return msg.textContent=error.message;

 const{error:joinError}=await sb.rpc("wpbl_join_league",{
  p_first_name:first_name,
  p_last_name:last_name
 });

 if(joinError)return msg.textContent=joinError.message;

 session=data.user.id;
 await reload();
}

function headToHead(a,b){
 const s=season();
 if(!s)return 0;
 const weekIds=new Set(D.weeks.filter(w=>w.season_id===s.id).map(w=>w.id));
 let aw=0,bw=0;

 D.games.filter(g=>weekIds.has(g.week_id)&&g.status==="confirmed").forEach(g=>{
  const A=g.actual_team_a||[];
  const B=g.actual_team_b||[];
  const opposed=(A.includes(a)&&B.includes(b))||(A.includes(b)&&B.includes(a));
  if(!opposed)return;

  const aOnA=A.includes(a);
  const aWon=aOnA?g.score_a>g.score_b:g.score_b>g.score_a;
  if(aWon)aw++;else bw++;
 });

 return aw-bw;
}

function standingsData(){
 const s=season();
 if(!s)return[];

 const weekIds=new Set(D.weeks.filter(w=>w.season_id===s.id).map(w=>w.id));
 const rows={};
 const ensure=id=>rows[id]||(rows[id]={id,w:0,l:0,gp:0,pf:0,pa:0});

 splayers().forEach(ensure);

 D.games.filter(g=>weekIds.has(g.week_id)&&g.status==="confirmed").forEach(g=>{
  const A=g.actual_team_a||[];
  const B=g.actual_team_b||[];
  const aWin=g.score_a>g.score_b;

  A.forEach(id=>{
   const r=ensure(id);
   r.gp++;r.pf+=g.score_a||0;r.pa+=g.score_b||0;
   if(aWin)r.w++;else r.l++;
  });

  B.forEach(id=>{
   const r=ensure(id);
   r.gp++;r.pf+=g.score_b||0;r.pa+=g.score_a||0;
   if(aWin)r.l++;else r.w++;
  });
 });

 return Object.values(rows)
  .map(r=>({...r,pct:r.gp?r.w/r.gp:0,pd:r.pf-r.pa}))
  .sort((a,b)=>{
   if(b.pct!==a.pct)return b.pct-a.pct;
   const h=headToHead(a.id,b.id);
   if(h!==0)return -h;
   if(b.pd!==a.pd)return b.pd-a.pd;
   return b.w-a.w;
  });
}

async function setAvailability(wid,status){
 const{error}=await sb.rpc("wpbl_v2_set_availability",{
  p_week_id:wid,
  p_status:status
 });

 if(error)return toast(error.message);

 const existing=D.availability.find(a=>a.week_id===wid&&a.player_id===session);
 if(existing)existing.status=status;
 else D.availability.push({week_id:wid,player_id:session,status});

 render();
 reload();
}

function canSubmit(g){
 return isAdmin()||(g.actual_team_a||[]).includes(session)||(g.actual_team_b||[]).includes(session);
}

function canConfirm(g){
 if(isAdmin())return true;
 if(g.status!=="pending")return false;

 const A=g.actual_team_a||[];
 const B=g.actual_team_b||[];

 if(A.includes(g.submitted_by))return B.includes(session);
 if(B.includes(g.submitted_by))return A.includes(session);
 return false;
}

async function moveGame(id,dir){
 const g=D.games.find(x=>x.id===id);
 if(!g)return;

 const games=gamesFor(g.week_id);
 const other=games.find(x=>x.position===g.position+dir);
 if(!other)return;

 const temp=100000+g.position;

 let r=await sb.from("wpbl_v2_games").update({position:temp}).eq("id",g.id);
 if(r.error)return toast(r.error.message);

 r=await sb.from("wpbl_v2_games").update({position:g.position}).eq("id",other.id);
 if(r.error)return toast(r.error.message);

 r=await sb.from("wpbl_v2_games").update({position:other.position}).eq("id",g.id);
 if(r.error)return toast(r.error.message);

 await reload();
}

async function editPlayers(id){
 const g=D.games.find(x=>x.id===id);
 if(!g)return;

 const current=[...(g.actual_team_a||[]),...(g.actual_team_b||[])];
 const roster=splayers();

 const choose=(label,currentId)=>{
  const names=roster.map((pid,i)=>`${i+1}. ${pname(pid)}`).join("\n");
  const currentIndex=Math.max(0,roster.indexOf(currentId))+1;
  const n=Number(prompt(`${label}\n\n${names}`,currentIndex));
  return roster[n-1];
 };

 const a1=choose("Team A — Player 1",current[0]); if(!a1)return;
 const a2=choose("Team A — Player 2",current[1]); if(!a2)return;
 const b1=choose("Team B — Player 1",current[2]); if(!b1)return;
 const b2=choose("Team B — Player 2",current[3]); if(!b2)return;

 const{error}=await sb.rpc("wpbl_v2_set_actual_players",{
  p_game_id:id,
  p_team_a:[a1,a2],
  p_team_b:[b1,b2]
 });

 if(error)toast(error.message);
 else await reload();
}

 if(options.length<2)return toast("Enter at least two choices.");

 const{data,error}=await sb.from("wpbl_v2_posts")

 if(error)return toast(error.message);

  post_id:data.id,
  option_text,
  position:i+1

async function generatePlayoffs(){
 const s=season();
 const n=Math.min(Number(s.playoff_qualifiers||4),standingsData().length);
 if(n<2)return toast("Not enough players.");

 await sb.from("wpbl_v2_playoff_matches").delete().eq("season_id",s.id);

 const top=standingsData().slice(0,n);
 const rows=[];

 for(let i=0;i<Math.floor(n/2);i++){
  rows.push({
   season_id:s.id,
   round:1,
   position:i+1,
   seed_a:i+1,
   seed_b:n-i,
   player_a:top[i].id,
   player_b:top[n-1-i].id,
   status:"scheduled"
  });
 }

 const{error}=await sb.from("wpbl_v2_playoff_matches").insert(rows);
 if(error)toast(error.message);
 else await reload();
}

let passwordRecoveryMode=
 window.location.hash.includes("type=recovery")||
 window.location.search.includes("type=recovery");

function renderPasswordRecovery(){
 document.getElementById("root").innerHTML=`
 <div class="auth"><div class="authbox">
 <img class="authlogo" src="${LOGO}">
 <h1>WPBL</h1>
 <p class="sub">Create your new WPBL password.</p>
 <div class="field"><label>New Password</label><input id="newPassword" type="password"></div>
 <div class="field"><label>Confirm Password</label><input id="confirmPassword" type="password"></div>
 <br>
 <button class="btn" style="width:100%" onclick="saveNewPassword()">Set Password</button>
 <p id="recoveryMsg" class="tiny muted"></p>
 </div></div>`;
}

async function saveNewPassword(){
 const password=$("#newPassword").value;
 const confirm=$("#confirmPassword").value;
 const msg=$("#recoveryMsg");

 if(password.length<8)
  return msg.textContent="Password must be at least 8 characters.";

 if(password!==confirm)
  return msg.textContent="Passwords do not match.";

 msg.textContent="Saving password...";

 const{error}=await sb.auth.updateUser({password});

 if(error)return msg.textContent=error.message;

 passwordRecoveryMode=false;
 history.replaceState({},document.title,window.location.pathname);
 await sb.auth.signOut();
 renderAuth();
}

sb.auth.onAuthStateChange(async(event,s)=>{
 session=s?.user?.id||"";

 if(event==="PASSWORD_RECOVERY"){
  passwordRecoveryMode=true;
  renderPasswordRecovery();
  return;
 }

 if(passwordRecoveryMode){
  if(s?.user)renderPasswordRecovery();
  return;
 }

 if(event==="SIGNED_IN"){
  const{error}=await sb.rpc("wpbl_finish_registration");
  if(error)console.error("WPBL registration:",error);
  await reload();
 }

 if(event==="SIGNED_OUT")renderAuth();
});

if(passwordRecoveryMode){
 sb.auth.getSession().then(({data})=>{
  session=data.session?.user?.id||"";
  renderPasswordRecovery();
 });
}else{
 boot();
}
